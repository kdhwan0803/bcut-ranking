<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAXIM B컷 · 점검 중</title>
<meta property="og:title" content="MAXIM B컷 · 잠시 점검 중">
<meta property="og:description" content="더 좋은 모습으로 곧 다시 찾아뵐게요.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1a1013,#0a0a0d 60%);
  color:#fff;font-family:'Apple SD Gothic Neo','Malgun Gothic',Pretendard,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  min-height:100%;padding:32px;text-align:center;overflow:hidden}
.wrap{max-width:440px;width:100%;position:relative;z-index:2}
.logo{display:inline-flex;align-items:center;gap:2px;margin-bottom:30px}
.logo b{font-size:44px;font-weight:900;letter-spacing:-2px;color:#fff;line-height:1}
.logo b span{color:#E60012}
.logo em{font-size:11px;font-weight:800;letter-spacing:3px;color:#8a8a92;font-style:normal;margin-left:8px;align-self:flex-start;margin-top:6px}
.badge{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:2px;color:#ff6b76;
  border:1px solid rgba(230,0,18,.5);background:rgba(230,0,18,.1);padding:6px 15px;border-radius:999px;margin-bottom:22px}
h1{font-size:26px;font-weight:900;letter-spacing:-.6px;line-height:1.35;margin-bottom:14px}
p{font-size:14.5px;line-height:1.75;color:#b9b9c1}
.dots{display:inline-flex;gap:7px;margin-top:30px}
.dots i{width:8px;height:8px;border-radius:50%;background:#E60012;opacity:.35;animation:bl 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.sns{margin-top:34px;font-size:13px;color:#8a8a92}
.sns a{color:#e1306c;font-weight:800;text-decoration:none}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(500px 260px at 50% 40%,rgba(230,0,18,.14),transparent 70%)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="logo"><b>B<span>cut</span></b><em>MAXIM</em></div>
  <div class="badge">● 점검 중 · MAINTENANCE</div>
  <h1>잠시 점검 중입니다</h1>
  <p>더 좋은 모습으로 준비하고 있어요.<br>곧 다시 찾아뵐게요. 감사합니다 🙏</p>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="sns">소식은 인스타그램 <a href="https://www.instagram.com/maximbcut/" target="_blank" rel="noopener">@maximbcut</a> 에서</div>
</div>
</body>
</html>
