<title>B컷 이상형 월드컵</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--red:#E60012;--ink:#16161a;--mut:#8a8a92;--line:#ececed;--bg:#f4f5f7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:0 auto;padding:0 18px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;letter-spacing:-.3px;text-decoration:none}.brand img{height:36px;width:auto;display:block;mix-blend-mode:multiply}.brand b{color:var(--red)}
.brand span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:2px;margin-left:6px}
.menu{display:flex;gap:6px}
.menu a{font-size:13.5px;font-weight:700;color:#555;text-decoration:none;padding:8px 12px;border-radius:8px}
.menu a.on,.menu a:hover{background:#f0f0f3;color:var(--ink)}
.nav-cta{background:var(--red);color:#fff;font-size:13px;font-weight:800;text-decoration:none;padding:9px 16px;border-radius:8px}
@media(max-width:640px){.menu{display:none}}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* intro */
.intro{text-align:center;padding:54px 0 40px}
.intro .cup{font-size:60px}
.intro h1{font-size:32px;font-weight:900;letter-spacing:-1px;margin-top:10px}
.intro h1 b{color:var(--red)}
.intro p{color:var(--mut);font-size:15px;margin-top:12px;line-height:1.7}
.start{display:inline-block;margin-top:26px;background:var(--red);color:#fff;font-weight:800;font-size:16px;padding:16px 46px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 8px 22px rgba(230,0,18,.28)}
.start:active{transform:translateY(1px)}
.sizePick{display:inline-flex;gap:6px;margin-top:20px;background:#ececed;border-radius:11px;padding:4px}
.sizePick button{border:0;background:transparent;font-family:inherit;font-weight:800;font-size:13px;color:#8a8a92;padding:8px 16px;border-radius:8px;cursor:pointer}
.sizePick button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* hall of fame */
.hof{max-width:560px;margin:36px auto 0;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 2px 20px rgba(20,20,30,.05)}
.hof h3{font-size:14px;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.hof h3 small{color:var(--mut);font-size:11px;font-weight:700}
.hofrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f4f4f7}
.hofrow:last-child{border-bottom:none}
.hofrow .r{width:22px;font-family:'Arial Black',sans-serif;font-weight:900;color:#c7c7cf}
.hofrow.top1 .r{color:var(--red)}
.hofrow img{width:40px;height:40px;object-fit:cover;border-radius:8px;background:#eee}
.hofrow .t{flex:1;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hofrow .c{font-weight:900;color:var(--red);font-size:14px}.hofrow .c small{color:#b0b0b8;font-size:11px}
.hof .empty{color:var(--mut);font-size:13px;text-align:center;padding:10px}

/* match */
.stage{padding:22px 0 50px;display:none}
.roundbar{text-align:center;margin-bottom:6px}
.roundbar .rl{font-size:22px;font-weight:900;letter-spacing:-.5px}
.roundbar .rl b{color:var(--red)}
.roundbar .prog{color:var(--mut);font-size:13px;font-weight:700;margin-top:4px}
.pbar{height:6px;background:#e6e6ea;border-radius:99px;overflow:hidden;max-width:420px;margin:10px auto 0}
.pbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.versus{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:8px;margin-top:22px}
.pick{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(20,20,30,.08);cursor:pointer;transition:transform .12s,box-shadow .12s;border:2px solid transparent}
.pick:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(230,0,18,.16);border-color:var(--red)}
.pick .ph{width:100%;aspect-ratio:3/4;background:#e9e9ee;overflow:hidden}
.pick .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pick .pb{padding:14px 16px 16px}
.pick .pt{font-size:17px;font-weight:900;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pm{font-size:13px;color:var(--red);font-weight:800;margin-top:5px}
.pick .badges{margin-top:8px}
.bg{display:inline-block;font-size:9px;font-weight:900;padding:2px 5px;border-radius:3px;margin-right:3px}
.bg.b19{border:1px solid var(--red);color:var(--red)}.bg.vid{border:1px solid #ccc;color:#999}
.vs{font-family:'Arial Black',sans-serif;font-weight:900;font-size:22px;color:#c7c7cf;text-align:center}
@media(max-width:600px){.versus{grid-template-columns:1fr;gap:6px}.vs{padding:2px 0}.pick .pt{font-size:15px}}

/* champion */
.champ{display:none;text-align:center;padding:36px 0 60px}
.champ .crown{font-size:46px}
.champ .eyt{color:var(--red);font-weight:900;letter-spacing:2px;font-size:13px;margin-top:6px}
.champ .cwrap{max-width:340px;margin:16px auto 0;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(20,20,30,.14)}
.champ .cwrap .ph{width:100%;aspect-ratio:3/4;background:#e9e9ee}
.champ .cwrap .ph img{width:100%;height:100%;object-fit:cover;display:block}
.champ .cwrap .cb{padding:18px}
.champ .ct{font-size:22px;font-weight:900}
.champ .cm{color:var(--red);font-weight:800;margin-top:6px}
.champ .acts{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.champ .acts a,.champ .acts button{font-family:inherit;font-weight:800;font-size:14px;padding:13px 24px;border-radius:10px;text-decoration:none;cursor:pointer;border:0}
.champ .acts .primary{background:var(--ink);color:#fff}
.champ .acts .red{background:var(--red);color:#fff}
.champ .acts .ghost{background:#e8e8ec;color:#333}
.loading{padding:70px 0;text-align:center;color:var(--mut);font-weight:700}
footer{text-align:center;padding:30px 0 50px;color:#9a9aa2;font-size:12px;line-height:1.8}
footer .fb{font-family:'Arial Black',sans-serif;font-weight:900;font-size:15px;color:var(--ink);letter-spacing:1px;margin-bottom:8px}
footer .fb b{color:var(--red)}
.ageGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(18,18,24,.5);backdrop-filter:blur(24px) saturate(.85);-webkit-backdrop-filter:blur(24px) saturate(.85)}
.ageBox{max-width:360px;width:100%;background:#fff;border-radius:22px;padding:30px 26px 24px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:ageUp .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ageUp{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.ageBadge{width:60px;height:60px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#f0554a,#e5352b);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#fff;box-shadow:0 8px 24px rgba(229,53,43,.35)}
.ageTitle{font-size:19px;font-weight:900;color:#1a1a1f;letter-spacing:-.3px}
.ageDesc{font-size:13.5px;line-height:1.65;color:#666;margin-top:10px}
.ageDesc b{color:#1a1a1f}
.ageBtns{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.ageBtns button{border:0;font-family:inherit;font-size:14.5px;font-weight:800;padding:14px;border-radius:12px;cursor:pointer;transition:transform .12s}
.ageBtns button:hover{transform:translateY(-1px)}
.ageIn{background:linear-gradient(120deg,#f0554a,#e5352b);color:#fff}
.ageMinor{background:#f2f2f5;color:#555}
.ageNote{font-size:11px;color:#9a9aa2;margin-top:14px;line-height:1.6}
.b19blur{filter:blur(10px)!important;transform:scale(1.04)}
.b19w{position:relative}
.b19w::after{content:"19+";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(229,53,43,.92);color:#fff;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:none;letter-spacing:.5px}
</style></head>
<body>
<div id="ageGate" class="ageGate">
  <div class="ageBox">
    <div class="ageBadge">19+</div>
    <div class="ageTitle">잠깐, 나이를 확인할게요</div>
    <div class="ageDesc">이 사이트에는 <b>만 19세 이상</b> 성인 화보가 포함돼 있어요.<br>선택에 따라 19금 이미지가 흐리게 표시됩니다.</div>
    <div class="ageBtns">
      <button class="ageIn" onclick="setAge('adult')">만 19세 이상 · 모두 보기</button>
      <button class="ageMinor" onclick="setAge('minor')">만 19세 미만 · 19금은 가리기</button>
    </div>
    <div class="ageNote">선택은 이 기기에 저장돼요.</div>
  </div>
</div>
<script>
function getAge(){try{return localStorage.getItem('bcut_age')||'';}catch(e){return '';}}
function openAgeGate(){var g=document.getElementById('ageGate');if(g)g.style.display='flex';}
function ageBlurScan(){try{if(typeof DATA==='undefined'||!DATA||!DATA.works)return;var minor=getAge()==='minor';if(!minor){document.querySelectorAll('img.b19blur').forEach(function(i){i.classList.remove('b19blur');});document.querySelectorAll('.b19w').forEach(function(e){e.classList.remove('b19w');});return;}var els=document.querySelectorAll('[onclick*="openWorkModal("],a[href*="/work/"],[data-wid]');els.forEach(function(el){var id=null,oc=el.getAttribute('onclick')||'',m=oc.match(/openWorkModal\('([^']+)'\)/);if(m)id=m[1];if(!id){var h=el.getAttribute('href')||'',hm=h.match(/\/work\/([^\/?#]+)/);if(hm)id=decodeURIComponent(hm[1]);}if(!id)id=el.getAttribute('data-wid');if(id&&DATA.works[id]&&DATA.works[id].b19){var _bl=function(im){im.classList.add('b19blur');if(im.parentElement)im.parentElement.classList.add('b19w');};el.querySelectorAll('img').forEach(_bl);if(el.tagName==='IMG')_bl(el);}});}catch(e){}}
function setAge(m){try{localStorage.setItem('bcut_age',m);}catch(e){}var g=document.getElementById('ageGate');if(g)g.style.display='none';document.body.classList.toggle('age-minor',m==='minor');ageBlurScan();}
(function(){try{var a=getAge();if(a){var g=document.getElementById('ageGate');if(g)g.style.display='none';document.body.classList.toggle('age-minor',a==='minor');}var _p=false;function _s(){if(_p)return;_p=true;(window.requestAnimationFrame||window.setTimeout)(function(){_p=false;if(getAge()==='minor')ageBlurScan();});}if(window.MutationObserver&&document.body){new MutationObserver(_s).observe(document.body,{childList:true,subtree:true});}}catch(e){}})();
</script>

<div class="wrap">
  <!-- INTRO -->
  <section class="intro" id="intro">
    <div class="loading" id="introLoading">불러오는 중…</div>
    <div id="introBody" style="display:none">
      <div class="cup">🏆</div>
      <h1>화보 <b>이상형 월드컵</b></h1>
      <p id="introDesc">두 화보 중 더 끌리는 쪽을 고르세요.<br>토너먼트 끝에 당신만의 <b>최애 화보</b>가 남습니다.</p>
      <div class="sizePick" id="sizePick"></div>
      <div><button class="start" onclick="startGame()">시작하기</button></div>
      <div class="hof" id="globalTop"></div>
      <div class="hof" id="hof"></div>
    </div>
  </section>

  <!-- MATCH -->
  <section class="stage" id="stage">
    <div class="roundbar">
      <div class="rl" id="roundLabel"></div>
      <div class="prog" id="prog"></div>
      <div class="pbar"><i id="pbarFill"></i></div>
    </div>
    <div class="versus">
      <div class="pick" id="pickA" onclick="choose(0)"></div>
      <div class="vs">VS</div>
      <div class="pick" id="pickB" onclick="choose(1)"></div>
    </div>
  </section>

  <!-- CHAMPION -->
  <section class="champ" id="champ"></section>

<footer><div class="fb">MAXIM <b>B컷</b></div>이상형 월드컵 · 화보 데이터 기준<br><a href="index.html" style="color:var(--mut);text-decoration:underline">랭킹 보러가기</a> · <a onclick="openAgeGate()" style="color:var(--mut);text-decoration:underline;cursor:pointer">연령 설정 변경</a></footer>

<script>
const WKEY='bcut_wc_v1';
let DATA=null, POOL=[], SIZE=32, bracket=[], winners=[], mi=0, champion=null;

/* ===== 전체 이상형 월드컵 TOP10 집계 (SheetDB) ===== */
const SHEETDB_URL='https://sheetdb.io/api/v1/d4bc9pnsklz0n'; /* ← 사무실에서 SheetDB API URL 붙여넣기 (예: https://sheetdb.io/api/v1/xxxxxxxx) · 비우면 아래 예시 데이터만 표시 */
const SEED_WINS={ /* 예시 데이터(5~7월 인기 기준) — 실제 우승 결과가 쌓이면 이 값들을 지워 {} 로 비우면 됩니다 */
  '1750':48,'1711':41,'1712':37,'1910':33,'1794':29,'1865':26,'1719':22,'1932':19,'1217':16,'1706':14
};

/* ---- 저장/집계 (나중에 공용 백엔드 POST를 recordWinner에 추가) ---- */
function loadStats(){try{return JSON.parse(localStorage.getItem(WKEY)||'{"wins":{},"plays":0}');}catch(e){return {wins:{},plays:0};}}
function recordWinner(id){
  try{const s=loadStats();s.wins[id]=(s.wins[id]||0)+1;s.plays=(s.plays||0)+1;localStorage.setItem(WKEY,JSON.stringify(s));}catch(e){}
  try{ if(SHEETDB_URL){ var w=workById(id);
    fetch(SHEETDB_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:[{work_id:id,title:(w.title||id),ts:new Date().toISOString()}]})}).catch(function(){});
  } }catch(e){}
}

/* ---- 헬퍼 ---- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pow2Below(n){let p=2;while(p*2<=n)p*=2;return p;}
function roundName(n){return n>=32?'32강':n>=16?'16강':n>=8?'8강':n>=4?'준결승':'결승';}
function badges(w){let o='';if(w.b19)o+='<span class="bg b19">19</span>';if(w.vid)o+='<span class="bg vid">▶</span>';return o;}
function workById(id){return DATA.works[id]||{};}

/* ---- 인트로 ---- */
function renderSizePick(){
  const max=pow2Below(POOL.length);
  const opts=[8,16,32].filter(s=>s<=max);
  if(!opts.length)opts.push(Math.max(2,max));
  if(SIZE>max||!opts.includes(SIZE))SIZE=opts[opts.length-1];
  document.getElementById('sizePick').innerHTML=opts.map(s=>`<button class="${s===SIZE?'on':''}" onclick="setSize(${s})">${s}강</button>`).join('');
  document.getElementById('introDesc').innerHTML=`두 화보 중 더 끌리는 쪽을 고르세요.<br>등록 화보 <b>${POOL.length}개</b> 중 <b>${SIZE}개</b>가 토너먼트에 오릅니다.`;
}
function setSize(s){SIZE=s;renderSizePick();}
function renderHOF(){
  const s=loadStats();const el=document.getElementById('hof');
  const arr=Object.keys(s.wins).map(id=>({id,c:s.wins[id]})).sort((a,b)=>b.c-a.c).slice(0,5);
  el.innerHTML=`<h3>내 픽 명예의 전당 <small>${s.plays||0}회 플레이</small></h3>`+
    (arr.length?arr.map((x,i)=>{const w=workById(x.id);return `<div class="hofrow ${i===0?'top1':''}" data-wid="${x.id}"><div class="r">${i+1}</div><img src="${w.img||''}" onerror="this.style.opacity=.15"><div class="t">${w.title||x.id}</div><div class="c">${x.c}<small>회 우승</small></div></div>`;}).join('')
      :'<div class="empty">아직 플레이 기록이 없어요. 첫 우승 화보를 뽑아보세요!</div>');
}
async function renderGlobalTop(elId){
  const el=document.getElementById(elId||'globalTop'); if(!el||!DATA)return;
  let counts=Object.assign({},SEED_WINS);
  if(SHEETDB_URL){
    try{const r=await fetch(SHEETDB_URL,{cache:'no-store'});const rows=await r.json();
      (Array.isArray(rows)?rows:[]).forEach(function(row){var id=row&&(row.work_id||row.workId||row.id);if(id)counts[id]=(counts[id]||0)+1;});
    }catch(e){}
  }
  const arr=Object.keys(counts).filter(id=>DATA.works&&DATA.works[id]).map(id=>({id:id,c:counts[id]})).sort((a,b)=>b.c-a.c).slice(0,10);
  el.innerHTML='<h3>👑 전체 이상형 월드컵 TOP 10 <small>모두의 선택</small></h3>'+
    (arr.length?arr.map(function(x,i){var w=workById(x.id);return '<div class="hofrow '+(i===0?'top1':'')+'" data-wid="'+x.id+'"><div class="r">'+(i+1)+'</div><img src="'+(w.img||'')+'" onerror="this.style.opacity=.15"><div class="t">'+(w.title||x.id)+'</div><div class="c">'+x.c+'<small>회 우승</small></div></div>';}).join('')
      :'<div class="empty">아직 집계된 결과가 없어요.</div>');
  try{if(getAge()==='minor'&&window.ageBlurScan)ageBlurScan();}catch(e){}
}

/* ---- 게임 ---- */
function startGame(){
  bracket=shuffle(POOL).slice(0,SIZE); winners=[]; mi=0; champion=null;
  document.getElementById('intro').style.display='none';
  document.getElementById('champ').style.display='none';
  document.getElementById('stage').style.display='block';
  renderMatch();
}
function renderMatch(){
  if(bracket.length===1){return endGame(bracket[0]);}
  const a=workById(bracket[mi]), b=workById(bracket[mi+1]);
  const total=bracket.length/2, cur=mi/2+1;
  document.getElementById('roundLabel').innerHTML=(bracket.length===2?'<b>결승</b>':roundName(bracket.length));
  document.getElementById('prog').textContent=bracket.length===2?'마지막 한 판':`${cur} / ${total} 경기`;
  document.getElementById('pbarFill').style.width=(cur/total*100)+'%';
  document.getElementById('pickA').innerHTML=card(a,bracket[mi]);
  document.getElementById('pickB').innerHTML=card(b,bracket[mi+1]);
  window.scrollTo({top:0,behavior:'smooth'});
}
function card(w,id){
  return `<div class="ph" data-wid="${id||''}"><img src="${w.img||''}" onerror="this.style.opacity=.15" alt=""></div>
  <div class="pb"><div class="pt">${w.title||'-'}</div><div class="pm">${(w.models||[]).join(' & ')||'—'}</div><div class="badges">${badges(w)}</div></div>`;
}
function choose(side){
  winners.push(bracket[mi+side]); mi+=2;
  if(mi>=bracket.length){ bracket=winners; winners=[]; mi=0; }
  renderMatch();
}
function endGame(id){
  champion=id; recordWinner(id); track('worldcup_finish',{winner:id});
  const w=workById(id);
  document.getElementById('stage').style.display='none';
  const el=document.getElementById('champ'); el.style.display='block';
  el.innerHTML=`<div class="crown">👑</div><div class="eyt">MY No.1 화보</div>
    <div class="cwrap"><div class="ph" data-wid="${id}"><img src="${w.img||''}" onerror="this.style.opacity=.15" alt=""></div>
      <div class="cb"><div class="ct">${w.title||id} ${badges(w)}</div><div class="cm">${(w.models||[]).join(' & ')||'—'}</div></div></div>
    <div class="acts">
      <a class="red" href="https://bcut.maximkorea.net/work/${id}" target="_blank">B컷에서 보기 ›</a>
      <button class="primary" onclick="startGame()">다시 하기</button>
      <button class="ghost" onclick="shareResult()">결과 공유</button>
    </div>
    <div class="hof" id="globalTopC" style="margin-top:22px"></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
  renderHOF(); renderGlobalTop('globalTopC');
}
function shareResult(){
  const w=workById(champion);
  const text=`내 화보 이상형 월드컵 우승: ${w.title||''} (${(w.models||[]).join(' & ')||''}) — MAXIM B컷`;
  if(navigator.share){navigator.share({title:'B컷 이상형 월드컵',text,url:location.href}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text+' '+location.href).then(()=>alert('결과가 복사됐어요!'));}
  else alert(text);
}

  renderSizePick(); renderHOF(); renderGlobalTop("globalTop");
}).catch(()=>{

});
